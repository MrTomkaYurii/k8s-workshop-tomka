# =============================================================================
# nodeport.yaml — NodePort Service для WeatherApi
# =============================================================================
#
# ЩО ЦЕ: Service типу NodePort — розширення ClusterIP.
#         Відкриває порт на КОЖНОМУ вузлі кластеру (навіть тих, де немає Pod'ів).
#         Трафік на <будь-який вузол>:nodePort перенаправляється в ClusterIP,
#         а звідти -- на один з Pod'ів через iptables.
#
# НАВІЩО: Доступ до сервісу ззовні кластеру без хмарного LoadBalancer.
#         Зручно для локального тестування (kind, minikube) і dev-середовища.
#         В production зазвичай Ingress Controller (Урок 9) краще за NodePort.
#
# ДОСТУПНІСТЬ:
#   Всередині кластеру:   YES (через ClusterIP або DNS -- так само як ClusterIP)
#   Ззовні кластеру:      YES -- через <вузол-IP>:<nodePort>
#
# ШЛЯХ ТРАФІКУ:
#   Клієнт --> <Node IP>:30080 --> iptables NodePort правило
#           --> ClusterIP:80 --> iptables DNAT --> PodIP:80
#
# ВИКОРИСТАННЯ:
#   kubectl apply -f nodeport.yaml
#   kubectl get services
#   curl http://<node-ip>:30080
# =============================================================================

apiVersion: v1
kind: Service

metadata:
  name: weather-api-nodeport   # окреме ім'я -- не конфліктує з ClusterIP Service
  namespace: default

  labels:
    app: weather-api

  annotations:
    # Документуємо навіщо цей NodePort (хороша практика)
    description: "NodePort для доступу ззовні під час розробки. Production: використовуй Ingress"

# ---------------------------------------------------------------------------
# spec
# ---------------------------------------------------------------------------
spec:

  type: NodePort   # NodePort включає ClusterIP + відкриває порт на вузлах

  # selector -- той самий що і в ClusterIP Service
  # Обидва Services можуть вказувати на ті самі Pod'и
  selector:
    app: weather-api

  ports:
    - name: http
      protocol: TCP

      # port -- порт всередині кластеру (ClusterIP:port)
      port: 80

      # targetPort -- порт на Pod'і
      targetPort: 80

      # nodePort -- порт що відкривається на кожному вузлі
      # Діапазон: 30000-32767 (налаштовується в kube-apiserver)
      # Якщо не вказати -- K8s автоматично вибере вільний порт з діапазону
      # Явне значення зручне: знаєш точно який порт відкрити у файрволі
      # НЕ робіть так: nodePort поза діапазоном 30000-32767
      nodePort: 30080

  # externalTrafficPolicy -- що робити з трафіком що прийшов на вузол
  #
  # Cluster (за замовчуванням):
  #   Трафік може бути перенаправлений на Pod на ІНШОМУ вузлі.
  #   Плюс: рівномірне балансування між усіма Pod'ами.
  #   Мінус: додатковий мережевий стрибок між вузлами.
  #   Мінус: вихідна IP клієнта замінюється на IP вузла (SNAT) -- губляться логи.
  #
  # Local:
  #   Трафік іде ТІЛЬКИ на Pod'и того вузла, на який прийшов.
  #   Якщо на вузлі немає Pod'ів -- запити відхиляються (HTTP 503).
  #   Плюс: зберігається оригінальна IP клієнта.
  #   Плюс: немає додаткового мережевого стрибка.
  #   Мінус: нерівномірне балансування якщо Pod'и розподілені нерівно.
  #   Використовують з: хмарними LoadBalancer'ами або коли важлива IP клієнта.
  externalTrafficPolicy: Cluster

# =============================================================================
# ДОСТУП В KIND:
#
# Знайти IP вузла:
#   kubectl get nodes -o wide
#
# Зверненутись до сервісу:
#   curl http://<internal-ip>:30080
#
# Якщо kind-config.yaml має extraPortMappings з hostPort: 30000:
#   curl http://localhost:30000
#
# ПОДИВИТИСЬ iptables правила на вузлі (для розуміння механіки):
#   docker exec -it workshop-worker bash
#   iptables -t nat -L KUBE-NODEPORTS -n --line-numbers
# =============================================================================
