# =============================================================================
# kind-config.yaml — Конфігурація локального Kubernetes кластеру
# =============================================================================
#
# ЩО ЦЕ: Опис кластеру для kind (Kubernetes IN Docker).
#         kind запускає вузли кластеру як Docker контейнери на вашому ПК.
#         Це дає повноцінний multi-node кластер без хмари і без VM.
#
# НАВІЩО: Для навчання та локальної розробки. Повністю повторює поведінку
#         production кластеру, але запускається за 2-3 хвилини.
#
# ВИМОГИ: Docker Desktop запущено, kind встановлено
#
# ВИКОРИСТАННЯ:
#   kind create cluster --name workshop --config kind-config.yaml
#   kind delete cluster --name workshop
# =============================================================================

kind: Cluster                       # Тип об'єкту — ми описуємо кластер
apiVersion: kind.x-k8s.io/v1alpha4  # Версія API kind (перевір: kind --version)

# networking — мережева конфігурація кластеру
networking:
  # Підмережа для Pod'ів (кожен Pod отримає IP з цього діапазону)
  # НЕ змінюй якщо не впевнений — конфліктує з VPN або корп. мережею
  podSubnet: "10.244.0.0/16"

  # Підмережа для Services (ClusterIP буде з цього діапазону)
  serviceSubnet: "10.96.0.0/12"

# nodes — список вузлів кластеру
# Кожен вузол = окремий Docker контейнер з повним набором K8s компонентів
nodes:

  # ==========================================================================
  # CONTROL PLANE — "Мозок" кластеру
  # Тут живуть: kube-apiserver, etcd, kube-scheduler, kube-controller-manager
  # В production зазвичай 3 або 5 control-plane вузлів для HA
  # Для навчання достатньо одного
  # ==========================================================================
  - role: control-plane

    # kubeadmConfigPatches — додаткова конфігурація kubeadm
    # (інструмент який ініціалізує K8s всередині вузла)
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          # Мітки і taints для control-plane вузла
          kubeletExtraArgs:
            # Дозволяємо запускати Pod'и на control-plane
            # НЕ робіть так в production — control-plane має бути чистим
            node-labels: "ingress-ready=true"

    # extraPortMappings — пробрасування портів
    # Дозволяє звертатись до сервісів в кластері через localhost
    # Потрібно для Ingress Controller (Урок 9)
    extraPortMappings:
      - containerPort: 80    # HTTP порт всередині kind-контейнера
        hostPort: 80         # Порт на вашому комп'ютері (localhost:80)
        protocol: TCP        # Протокол

      - containerPort: 443   # HTTPS порт
        hostPort: 443        # localhost:443
        protocol: TCP

      - containerPort: 30000 # NodePort діапазон (30000-32767)
        hostPort: 30000      # Для прямого доступу до NodePort Services
        protocol: TCP

  # ==========================================================================
  # WORKER NODE 1 — Перший робочий вузол
  # Тут запускаються Pod'и з нашими додатками
  # kubelet отримує завдання від API Server і запускає контейнери
  # ==========================================================================
  - role: worker

    # extraMounts — монтування директорій з хоста всередину вузла
    # Корисно для постійного зберігання даних між перезапусками kind
    # (для навчання можна закоментувати)
    # extraMounts:
    #   - hostPath: /tmp/kind-storage  # Директорія на вашому комп'ютері
    #     containerPath: /data         # Шлях всередині kind вузла

  # ==========================================================================
  # WORKER NODE 2 — Другий робочий вузол
  # Маючи 2 worker nodes ми можемо бачити як Scheduler розподіляє Pod'и
  # і симулювати сценарії відмови (що буде якщо впаде один вузол)
  # ==========================================================================
  - role: worker

# =============================================================================
# КОРИСНІ КОМАНДИ ДЛЯ РОБОТИ З КЛАСТЕРОМ:
#
# Список кластерів:
#   kind get clusters
#
# Список вузлів (як Docker контейнери):
#   docker ps | grep workshop
#
# Зайти всередину вузла (для дебагінгу):
#   docker exec -it workshop-worker bash
#
# Завантажити локальний Docker образ в кластер:
#   kind load docker-image my-app:latest --name workshop
#
# Видалити кластер:
#   kind delete cluster --name workshop
# =============================================================================