# =============================================================================
# resourcequota.yaml — Квота ресурсів для namespace
# =============================================================================
#
# ЩО ЦЕ: ResourceQuota обмежує ЗАГАЛЬНЕ споживання ресурсів
#         у namespace — суму всіх Pod'ів разом.
#
# НАВІЩО: Мультитенантність — коли кілька команд ділять один кластер.
#         Без квоти одна команда може зайняти всі ресурси кластеру.
#         З квотою — кожен namespace отримує свій "бюджет".
#
# ВІДМІННІСТЬ від LimitRange:
#   LimitRange  — обмеження на ОДИН Pod/Container
#   ResourceQuota — обмеження на ВЕСЬ namespace (сума всіх Pod'ів)
#
# ВАЖЛИВО: Якщо ResourceQuota є в namespace — Pod БЕЗ resources НЕ може
#          бути створений (бо не зрозуміло скільки він "з'їсть" від квоти).
#          Завжди встановлюй LimitRange разом з ResourceQuota!
#
# ВИКОРИСТАННЯ:
#   kubectl apply -f resourcequota.yaml
#   kubectl describe resourcequota workshop-quota
# =============================================================================

apiVersion: v1
kind: ResourceQuota
metadata:
  name: workshop-quota
  namespace: default
  labels:
    lesson: "06"

spec:
  hard:
    # -------------------------------------------------------------------------
    # CPU квоти — сума по всіх Pod'ах в namespace
    # -------------------------------------------------------------------------

    # Загальна сума requests.cpu всіх Pod'ів не може перевищити 8 CPU
    requests.cpu: "8"

    # Загальна сума limits.cpu всіх Pod'ів не може перевищити 16 CPU
    limits.cpu: "16"

    # -------------------------------------------------------------------------
    # Memory квоти — сума по всіх Pod'ах в namespace
    # -------------------------------------------------------------------------

    # Загальна сума requests.memory не може перевищити 8Gi
    requests.memory: "8Gi"

    # Загальна сума limits.memory не може перевищити 16Gi
    limits.memory: "16Gi"

    # -------------------------------------------------------------------------
    # Квоти на кількість об'єктів
    # -------------------------------------------------------------------------

    # Максимальна кількість Pod'ів у namespace
    pods: "30"

    # Максимальна кількість Service'ів
    services: "15"

    # Максимальна кількість PVC (PersistentVolumeClaim)
    persistentvolumeclaims: "10"

    # Максимальна кількість ConfigMap
    configmaps: "20"

    # Максимальна кількість Secret
    secrets: "20"

    # -------------------------------------------------------------------------
    # Storage квоти
    # -------------------------------------------------------------------------

    # Загальний обсяг requests.storage по всіх PVC
    requests.storage: "20Gi"

    # Обсяг для конкретного StorageClass (опціонально):
    # standard.storageclass.storage.k8s.io/requests.storage: "20Gi"

# =============================================================================
# ПЕРЕВІРКА:
#
# kubectl describe resourcequota workshop-quota
# Виведе таблицю Used vs Hard для кожного ресурсу.
# Приклад:
#
#   Resource              Used    Hard
#   --------              ----    ----
#   limits.cpu            1500m   16
#   limits.memory         768Mi   16Gi
#   pods                  6       30
#   requests.cpu          300m    8
#   requests.memory       384Mi   8Gi
#   services              4       15
#
# Спроба перевищити квоту:
#   kubectl run many-pods --image=nginx --restart=Never
#   → якщо pods: 30/30 → Error: exceeded quota: workshop-quota
# =============================================================================
