# =============================================================================
# postgres-secret.yaml — Credentials для PostgreSQL
# =============================================================================
#
# ЩО ЦЕ: Secret з паролями для PostgreSQL.
#         Повинен бути створений ДО StatefulSet.
#         Pod не запуститься якщо Secret відсутній
#         (CreateContainerConfigError).
#
# БЕЗПЕКА:
#   - Цей файл НЕ повинен потрапити в git (додай в .gitignore)
#   - stringData: K8s автоматично конвертує в base64 при збереженні
#   - base64 — це НЕ шифрування, просто кодування (Урок 4)
#   - В production: Sealed Secrets або External Secrets Operator
#
# ВИКОРИСТАННЯ:
#   kubectl apply -f postgres-secret.yaml
#   kubectl get secret postgres-secret
#   kubectl describe secret postgres-secret  (значення приховані)
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: default
  labels:
    app: postgres
    lesson: "07"

# Opaque — довільний набір ключ-значення (найпоширеніший тип)
# Інші типи: kubernetes.io/tls (TLS cert/key), kubernetes.io/dockerconfigjson
type: Opaque

# stringData: K8s зберігає як base64, але ми пишемо plaintext
# (зручніше ніж data: де треба вручну конвертувати)
stringData:
  # Пароль суперuser 'postgres' (POSTGRES_PASSWORD)
  password: "workshop-pg-password"

  # Пароль для реплікації — знадобиться в Уроці про HA PostgreSQL
  replication-password: "workshop-repl-password"

  # Connection string для WeatherApi (Урок 4 шаблон)
  # В production: postgres-svc замість localhost
  connection-string: "Host=postgres-svc;Port=5432;Database=weatherdb;Username=weather_user;Password=workshop-pg-password"

# =============================================================================
# ПЕРЕВІРКА:
#
# Список secrets:
#   kubectl get secret postgres-secret
#
# Ключі видно, значення приховані:
#   kubectl describe secret postgres-secret
#
# Прочитати конкретний ключ (base64 decode):
#   kubectl get secret postgres-secret \
#     -o jsonpath='{.data.password}' | base64 -d
#   → workshop-pg-password
# =============================================================================
