# =============================================================================
# secret.yaml — секретні дані WeatherApi
# =============================================================================
#
# ЩО ЦЕ: Secret — K8s об'єкт для паролів, ключів, токенів.
#
# ВАЖЛИВО: Secret НЕ зашифрований за замовчуванням.
#          Kubernetes зберігає його як base64 в etcd — це кодування, не шифрування.
#          Будь-хто з доступом до API Server може прочитати Secret.
#
#          Для справжнього захисту в production:
#          - Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
#          - External Secrets Operator + HashiCorp Vault / AWS Secrets Manager
#
#          АЛЕ: Secret все одно краще ніж паролі напряму в deployment.yaml або ConfigMap.
#
# ПРАВИЛО: secret.yaml НЕ повинен потрапляти в git.
#          Додай в .gitignore або використовуй Sealed Secrets.
#
# ВИКОРИСТАННЯ:
#   kubectl apply -f secret.yaml
#   kubectl get secret weather-api-secret
#
#   # Прочитати конкретне поле:
#   kubectl get secret weather-api-secret -o jsonpath='{.data.Redis__Password}' | base64 -d
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: weather-api-secret
  namespace: default
  labels:
    app: weather-api

# type: Opaque — довільний набір ключів (найпоширеніший тип)
# Інші типи: kubernetes.io/tls (TLS сертифікати), kubernetes.io/dockerconfigjson (registry auth)
type: Opaque

# stringData — зручніше для читання: K8s сам конвертує значення в base64
# Альтернатива — data, де значення вже в base64:
#   data:
#     Redis__Password: cmVkaXMtZGV2LXBhc3N3b3Jk
#
# Щоб закодувати вручну:
#   echo -n 'my-password' | base64
# Щоб декодувати:
#   echo 'cmVkaXMtZGV2...' | base64 -d
stringData:

  # PostgreSQL connection string
  # Host=<service-name> — DNS ім'я Services (вивчили в Уроці 3)
  ConnectionStrings__DefaultConnection: "Host=postgres-service;Port=5432;Database=weatherdb;Username=weather_user;Password=dev-password-change-in-prod"

  # Зовнішній API ключ (наприклад OpenWeatherMap)
  WeatherApi__ExternalApiKey: "your-openweathermap-api-key-here"

  # Redis пароль
  Redis__Password: "redis-dev-password"

  # JWT секрет для підпису токенів (мінімум 32 символи)
  # Auth__JwtSecret: "super-long-random-jwt-secret-at-least-32-chars"
